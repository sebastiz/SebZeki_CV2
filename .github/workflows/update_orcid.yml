name: Update from ORCID

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  # Allow a manual trigger from the Actions tab
  workflow_dispatch:
  # Re-run straight away when the scripts or overrides change
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "site_content.md"
      - ".github/workflows/update_orcid.yml"

concurrency:
  group: orcid-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the commit back

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # Fetch fresh data first, so the CV page built below uses today's data
      - name: Run ORCID update script
        run: python scripts/update_from_orcid.py

      - name: Build from site_content.md
        run: python scripts/build_from_content.py

      # Commits pushed with GITHUB_TOKEN don't re-trigger this workflow,
      # but Netlify still deploys them (no [skip ci] in the message).
      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "chore: auto-update publications and funding from ORCID"
            git pull --rebase origin master
            git push
          fi
